name: FlexPass CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  api-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - run: python -m pytest -q tests
  web-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: node --test tests/client-booking-timeline.test.mjs
      - run: npm run build
      - name: Verify brand photography is included in release
        run: |
          test -s dist/brand/arch-view.jpg
          file --mime-type dist/brand/arch-view.jpg | grep -q 'image/jpeg'
      - name: Verify official logo assets and favicon
        run: |
          for asset in flexpass-full.svg flexpass-monogram.svg flexpass-full-ivory.svg flexpass-monogram-ivory.svg; do
            test -s "dist/brand/$asset"
            grep -q '<svg' "dist/brand/$asset"
          done
          grep -q 'brand/flexpass-monogram.svg' dist/index.html
          if grep -q '%BASE_URL%' dist/index.html; then exit 1; fi
