# Free preview deployment. Render Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: flexpass-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: FLEXPASS_ENV
        value: production
      - key: FLEXPASS_DEMO_MODE
        value: 'false'
      - key: FLEXPASS_SECRET
        generateValue: true
      - key: FLEXPASS_ADMIN_EMAIL
        sync: false
      - key: FLEXPASS_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: flexpass-db
          property: connectionString

databases:
  - name: flexpass-db
    plan: free
    databaseName: flexpass
    user: flexpass
    ipAllowList: []
